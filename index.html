<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Be a Volunteer [BETA]</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: monospace, sans-serif;
            -webkit-touch-callout: none;
            touch-action: none; 
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        @keyframes slowRock {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff url('main-menu.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
        }

        #menu-player {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            object-fit: contain;
            pointer-events: none;
            animation: slowRock 5s infinite ease-in-out;
            transform-origin: center center;
        }

        #menu-koster {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            object-fit: contain;
            pointer-events: none;
            animation: slowRock 4.5s infinite ease-in-out;
            transform-origin: center center;
            filter: drop-shadow(0px 0px 8px rgba(255, 140, 0, 0.8));
        }

        #menu-main-content, #menu-confirm-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        #menu-main-content h1 {
            color: #000000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        #menu-confirm-content h2 {
            color: #000000;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.1s, background 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: #333333; }
        .btn:active { transform: scale(0.95); }

        .settings-container {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            width: 200px;
        }
        .volume-controls .btn-vol {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 24px;
            height: 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .volume-controls .btn-vol:active { transform: scale(0.9); }
        .vol-value { min-width: 35px; text-align: center; }

        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 80;
        }
        #pause-menu h2 { color: #ffffff; font-size: 24px; margin-bottom: 6px; }

        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Grass.png');
            background-repeat: repeat;
            background-size: 128px 128px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: none;
        }
        
        #night-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 22, 0.82);
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        #koster-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 16;
        }

        #koster-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 170, 50, 0.35) 0%, rgba(255, 100, 0, 0.15) 45%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            animation: firePulse 1.5s infinite alternate ease-in-out;
        }

        @keyframes firePulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        #koster {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            filter: drop-shadow(0px 0px 10px rgba(255, 140, 0, 0.8));
        }

        #player {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            transition: filter 0.2s ease;
        }
        .player-hit {
            filter: drop-shadow(0px 0px 4px red) sepia(100%) hue-rotate(-50deg) saturate(600%);
        }

        #weapon {
            position: absolute;
            width: 180px;
            height: 135px;
            display: none;
            pointer-events: none;
            z-index: 3;
            transform-origin: center center;
            transform: translate(-50%, -50%) rotate(0deg) scaleX(-1);
            transition: left 0.05s ease-out, top 0.05s ease-out;
        }
        #axe {
            position: absolute;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shakeAnim {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            20% { transform: translate(-50%, -50%) translate(-4px, 3px); }
            40% { transform: translate(-50%, -50%) translate(4px, -3px); }
            60% { transform: translate(-50%, -50%) translate(-3px, -1px); }
            80% { transform: translate(-50%, -50%) translate(3px, 1px); }
            100% { transform: translate(-50%, -50%) translate(0, 0); }
        }
        .shake-effect { animation: shakeAnim 0.4s ease; }

        .ground-item-elem {
            position: absolute;
            width: 75px;
            height: 75px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .drop-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            box-shadow: 0 0 4px #ffffff;
            animation: particleAnimation 500ms linear forwards;
        }

        @keyframes particleAnimation {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
        }

        #zombie {
            position: absolute;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            display: none;
            transition: filter 0.2s ease;
        }
        .zombie-hit {
            filter: drop-shadow(0px 0px 0px red) sepia(100%) hue-rotate(-50deg) saturate(600%);
        }

        /* ПОДТЯГИВАЕМ ИНВЕНТАРЬ БЛИЖЕ К ЦЕНТРУ */
        #hotbar-wrapper {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 40;
        }

        #hotbar {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 8px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        #drop-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            padding: 0 10px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
        }
        #drop-btn:hover { background: rgba(50, 50, 50, 0.85); border-color: #ffffff; }
        #drop-btn:active { transform: scale(0.95); }

        .inventory-slot {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #888888;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .inventory-slot.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.25);
            transform: scale(1.1);
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }
        .inventory-slot img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }

        /* ДЖОЙСТИКИ ПОДТЯНУТЫ БЛИЖЕ К ЦЕНТРУ (УМЕНЬШЕНЫ И СМЕЩЕНЫ) */
        .joystick-base {
            position: absolute;
            bottom: 75px;
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            touch-action: none;
            cursor: pointer;
            z-index: 20;
        }
        #move-joystick-base { left: 50px; }
        #aim-joystick-base { right: 50px; display: none; }
        .joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        /* МИНИМАПА И ХОД ИГРЫ ПОДТЯНУТЫ БЛИЖЕ К ЦЕНТРУ */
        #minimap-container {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            z-index: 20;
            overflow: hidden;
        }
        #minimap-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        #location-coords {
            position: absolute;
            bottom: 2px;
            left: 4px;
            color: #ffffff;
            font-size: 9px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        #campfire-hp-bar {
            position: absolute;
            top: 138px;
            left: 50px;
            width: 80px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 2px 5px;
            gap: 5px;
            z-index: 20;
        }
        #campfire-hp-bar img { width: 16px; height: 16px; object-fit: contain; pointer-events: none; }
        #campfire-hp-text { color: #ffaa44; font-size: 10px; font-weight: bold; }

        #day-night-timer {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            z-index: 20;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
        }

        #health-bar {
            position: absolute;
            top: 86px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ff4444;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            z-index: 20;
            text-align: center;
            white-space: nowrap;
        }

        #pause-btn {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #day-announcement {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="fade-overlay"></div>

<div id="main-menu">
    <img id="menu-player" src="Player-1.png" alt="Player" draggable="false">
    <img id="menu-koster" src="Koster-1.png" alt="Koster" draggable="false">
    
    <div id="menu-main-content">
        <h1>Be a Volunteer [BETA]</h1>
        <button id="play-btn" class="btn">ИГРАТЬ</button>
        <button id="exit-btn" class="btn">ВЫХОД</button>
    </div>

    <div class="settings-container" id="main-menu-settings">
        <div class="volume-controls">
            <span>МУЗЫКА:</span>
            <button class="btn-vol btn-vol-down" data-target="music">-</button>
            <span class="vol-value vol-value-music">100%</span>
            <button class="btn-vol btn-vol-up" data-target="music">+</button>
        </div>
        <div class="volume-controls">
            <span>ЗВУКИ:</span>
            <button class="btn-vol btn-vol-down" data-target="sfx">-</button>
            <span class="vol-value vol-value-sfx">100%</span>
            <button class="btn-vol btn-vol-up" data-target="sfx">+</button>
        </div>
    </div>

    <div id="menu-confirm-content" style="display: none;">
        <h2>ТОЧНО ЛИ ВЫ ЭТО ХОТИТЕ?</h2>
        <div class="btn-group">
            <button id="confirm-yes-btn" class="btn">ДА</button>
            <button id="confirm-no-btn" class="btn">НЕТ</button>
        </div>
    </div>
</div>

<div id="pause-menu">
    <h2>ПАУЗА</h2>
    <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
    <button id="to-menu-btn" class="btn">В МЕНЮ</button>

    <div class="settings-container" id="pause-menu-settings">
        <div class="volume-controls">
            <span>МУЗЫКА:</span>
            <button class="btn-vol btn-vol-down" data-target="music">-</button>
            <span class="vol-value vol-value-music">100%</span>
            <button class="btn-vol btn-vol-up" data-target="music">+</button>
        </div>
        <div class="volume-controls">
            <span>ЗВУКИ:</span>
            <button class="btn-vol btn-vol-down" data-target="sfx">-</button>
            <span class="vol-value vol-value-sfx">100%</span>
            <button class="btn-vol btn-vol-up" data-target="sfx">+</button>
        </div>
    </div>
</div>

<div id="scene">
    <div id="night-overlay"></div>

    <div id="koster-container">
        <div id="koster-glow"></div>
        <img id="koster" src="Koster-1.png" alt="Koster" draggable="false">
    </div>
    
    <img id="axe" src="Topor.png" alt="Topor" draggable="false">
    <div id="ground-items-container"></div>

    <img id="player" src="Player-1.png" alt="Player-1" draggable="false">
    <img id="weapon" src="Ryka-topor.png" alt="Ryka-topor" draggable="false">
    <img id="zombie" src="zombie-1.png" alt="zombie" draggable="false">
    
    <div id="hotbar-wrapper">
        <div id="hotbar">
            <div class="inventory-slot" data-index="0"></div>
            <div class="inventory-slot" data-index="1"></div>
            <div class="inventory-slot" data-index="2"></div>
            <div class="inventory-slot" data-index="3"></div>
            <div class="inventory-slot" data-index="4"></div>
        </div>
        <button id="drop-btn">ВЫБРОСИТЬ</button>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="80" height="80"></canvas>
        <div id="location-coords">X: 0 Y: 0</div>
    </div>
    <div id="campfire-hp-bar">
        <img src="Koster-1.png" alt="Campfire Icon" draggable="false">
        <div id="campfire-hp-text">100XP</div>
    </div>

    <div id="day-night-timer">ДЕНЬ 0 | НОЧЬ ЧЕРЕЗ 01:50</div>
    <div id="health-bar">HP: 10 / 10</div>
    <button id="pause-btn">❚❚</button>

    <div id="day-announcement">ДЕНЬ 0</div>

    <div id="move-joystick-base" class="joystick-base">
        <div id="move-joystick-stick" class="joystick-stick"></div>
    </div>

    <div id="aim-joystick-base" class="joystick-base">
        <div id="aim-joystick-stick" class="joystick-stick"></div>
    </div>
</div>

<script>
    // --- ЗВУКИ И МУЗЫКА ---
    const clickSound = new Audio('click-onthebutton.mp3');
    const deathSound = new Audio('death_sound.mp3');
    const playerHurtSound = new Audio('hurt-player-sound.mp3');

    const dayMusic = new Audio('backround-music.mp3');
    dayMusic.loop = true;
    const nightMusic = new Audio('night_music.mp3');
    nightMusic.loop = true;

    let musicVolume = localStorage.getItem('musicVolume') !== null ? parseFloat(localStorage.getItem('musicVolume')) : 1.0;
    let sfxVolume = localStorage.getItem('sfxVolume') !== null ? parseFloat(localStorage.getItem('sfxVolume')) : 1.0;

    let currentActiveMusic = dayMusic;

    function applyVolumes() {
        dayMusic.volume = musicVolume;
        nightMusic.volume = musicVolume;
    }
    applyVolumes();

    function switchBackgroundMusic(targetIsNight) {
        const outgoing = targetIsNight ? dayMusic : nightMusic;
        const incoming = targetIsNight ? nightMusic : dayMusic;

        incoming.currentTime = 0;
        incoming.volume = 0;
        incoming.play().catch(() => {});
        currentActiveMusic = incoming;

        let fadeSteps = 20;
        let stepTime = 100;
        let currentStep = 0;

        let fadeInterval = setInterval(() => {
            currentStep++;
            let progress = currentStep / fadeSteps;

            incoming.volume = Math.min(musicVolume, progress * musicVolume);
            outgoing.volume = Math.max(0, (1 - progress) * musicVolume);

            if (currentStep >= fadeSteps) {
                clearInterval(fadeInterval);
                outgoing.pause();
                outgoing.volume = musicVolume;
            }
        }, stepTime);
    }

    function playClickSound() {
        clickSound.currentTime = 0;
        clickSound.volume = sfxVolume;
        clickSound.play().catch(() => {});
    }

    function playDeathSound() {
        deathSound.currentTime = 0;
        deathSound.volume = sfxVolume;
        deathSound.play().catch(() => {});
    }

    function playPlayerHurtSound() {
        playerHurtSound.currentTime = 0;
        playerHurtSound.volume = sfxVolume;
        playerHurtSound.play().catch(() => {});
    }

    function updateVolumeDisplays() {
        document.querySelectorAll('.vol-value-music').forEach(el => {
            el.textContent = `${Math.round(musicVolume * 100)}%`;
        });
        document.querySelectorAll('.vol-value-sfx').forEach(el => {
            el.textContent = `${Math.round(sfxVolume * 100)}%`;
        });
        applyVolumes();
    }
    updateVolumeDisplays();

    document.querySelectorAll('.btn-vol-up').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (e.target.dataset.target === 'music') {
                musicVolume = Math.min(1.0, musicVolume + 0.1);
                localStorage.setItem('musicVolume', musicVolume);
            } else {
                sfxVolume = Math.min(1.0, sfxVolume + 0.1);
                localStorage.setItem('sfxVolume', sfxVolume);
            }
            updateVolumeDisplays();
            playClickSound();
        });
    });

    document.querySelectorAll('.btn-vol-down').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (e.target.dataset.target === 'music') {
                musicVolume = Math.max(0.0, musicVolume - 0.1);
                localStorage.setItem('musicVolume', musicVolume);
            } else {
                sfxVolume = Math.max(0.0, sfxVolume - 0.1);
                localStorage.setItem('sfxVolume', sfxVolume);
            }
            updateVolumeDisplays();
            playClickSound();
        });
    });

    document.querySelectorAll('.btn, #drop-btn, #pause-btn').forEach(btn => {
        btn.addEventListener('click', playClickSound);
    });

    // --- ОСНОВНАЯ ЛОГИКА ИГРЫ ---
    const fadeOverlay = document.getElementById('fade-overlay');
    const mainMenu = document.getElementById('main-menu');
    const menuMainContent = document.getElementById('menu-main-content');
    const menuConfirmContent = document.getElementById('menu-confirm-content');
    const mainMenuSettings = document.getElementById('main-menu-settings');

    document.addEventListener('dragstart', (e) => e.preventDefault());

    let isPaused = false;

    let playerHP = 10;
    let canTakeDamage = true;
    let canAttack = true;

    let campfireHP = 100;
    let campfireTimerCounter = 0;

    const campfireX = window.innerWidth / 2;
    const campfireY = window.innerHeight / 2;
    const campfireRadius = 55; // Уменьшенный радиус костра под меньший спрайт

    let posX = 0, posY = 0;
    let speedX = 0, speedY = 0;
    const maxSpeed = 5;

    let locX = 0, locY = 0;
    const MIN_LOC = -3, MAX_LOC = 3;

    const paddingX = 70, paddingYTop = 70, paddingYBottom = 70; 

    let inventory = [null, null, null, null, null]; 
    let itemAngles = [0, 0, 0, 0, 0]; 
    let activeSlotIndex = null; 
    let isAimingActive = false;

    let isMoveDragging = false;
    let moveTouchId = null;
    let isAimDragging = false;
    let aimTouchId = null;

    const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, Space: false };

    let isMoving = false;
    let animTimer = null;
    let currentFrame = 0;

    const gridSize = 80;

    exitBtn.addEventListener('click', () => {

        mainMenuSettings.style.display = 'none';
        menuConfirmContent.style.display = 'flex';
    });

    confirmYesBtn.addEventListener('click', () => {
        window.close();
        window.location.href = "about:blank";
    });

    confirmNoBtn.addEventListener('click', () => {
        menuConfirmContent.style.display = 'none';
        mainMenuSettings.style.display = 'flex';
        menuMainContent.style.display = 'flex';
    });

    function dropSelectedItem() {
        if (!isGameRunning || isPaused || activeSlotIndex === null) return;
        const currentItem = inventory[activeSlotIndex];
        if (!currentItem) return;

        inventory[activeSlotIndex] = null;
        renderInventoryUI();
        updateWeaponInHand();

        const offsets = [
            {dx: -90, dy: 0}, {dx: 90, dy: 0}, {dx: 0, dy: -90}, {dx: 0, dy: 90},
            {dx: -90, dy: -90}, {dx: -90, dy: 90}, {dx: 90, dy: -90}, {dx: 90, dy: 90}
        ];
        const randomOffset = offsets[Math.floor(Math.random() * offsets.length)];
        
        let dropScreenX = posX + randomOffset.dx;
        let dropScreenY = posY + randomOffset.dy;

        dropScreenX = Math.max(60, Math.min(window.innerWidth - 60, dropScreenX));
        dropScreenY = Math.max(60, Math.min(window.innerHeight - 60, dropScreenY));

        if (currentItem.type === 'axe') {
            isAxeOnGround = true;
            axeX = dropScreenX;
            axeY = dropScreenY;
            window.axeLocX = locX;
            window.axeLocY = locY;
            axe.style.left = `${axeX}px`;
            axe.style.top = `${axeY}px`;
        } else if (currentItem.type === 'hvorost') {
            groundHvorostList.push({
                id: Math.random().toString(),
                locX: locX,
                locY: locY,
                x: dropScreenX,
                y: dropScreenY
            });
        }

        createWhiteFountainParticles(posX, posY);
        updateVisibilityForCurrentLocation();
    }

    dropBtn.addEventListener('click', dropSelectedItem);

    function createWhiteFountainParticles(x, y) {
        const particleCount = 15;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'drop-particle';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 70 + 20;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance - 15;

            particle.style.setProperty('--dx', `${dx}px`);
            particle.style.setProperty('--dy', `${dy}px`);
            scene.appendChild(particle);

            setTimeout(() => particle.remove(), 500);
        }
    }

    function selectSlot(index) {
        if (activeSlotIndex === index) {
            activeSlotIndex = null;
            slots.forEach(slot => slot.classList.remove('active'));
            updateWeaponInHand();
            return;
        }

        activeSlotIndex = index;
        slots.forEach((slot, i) => {
            if (i === index) slot.classList.add('active');
            else slot.classList.remove('active');
        });
        updateWeaponInHand();
    }

    slots.forEach((slot, index) => {
        slot.addEventListener('click', () => selectSlot(index));
    });

    window.addEventListener('wheel', (e) => {
        if (!isGameRunning || isPaused) return;
        if (activeSlotIndex === null) {
            activeSlotIndex = e.deltaY > 0 ? 0 : 4;
        } else {
            if (e.deltaY > 0) activeSlotIndex = (activeSlotIndex + 1) % 5;
            else activeSlotIndex = (activeSlotIndex - 1 + 5) % 5;
        }
        selectSlot(activeSlotIndex);
    });

    function addItemToInventory(itemType, iconSrc) {
        const emptyIndex = inventory.findIndex(item => item === null);
        if (emptyIndex === -1) return false;

        inventory[emptyIndex] = { type: itemType, icon: iconSrc };
        itemAngles[emptyIndex] = 0; 
        renderInventoryUI();
        
        if (emptyIndex === activeSlotIndex) updateWeaponInHand();
        
        return true;
    }

    function renderInventoryUI() {
        slots.forEach((slot, i) => {
            slot.innerHTML = '';
            if (inventory[i]) {
                const img = document.createElement('img');
                img.src = inventory[i].icon;
                slot.appendChild(img);
            }
        });
    }

    function getSelectedItem() {
        return activeSlotIndex === null ? null : inventory[activeSlotIndex];
    }

    function updateWeaponInHand() {
        const currentItem = getSelectedItem();
        if (currentItem) {
            weapon.style.display = 'block';
            aimBase.style.display = 'block';
            if (currentItem.type === 'axe') weapon.src = 'Ryka-topor.png';
            else if (currentItem.type === 'hvorost') weapon.src = 'Ryka-hvorost.png';
        } else {
            weapon.style.display = 'none';
            aimBase.style.display = 'none';
        }
        updatePlayerSprite();
    }

    function updatePlayerSprite() {
        const hasItemInHand = getSelectedItem() !== null;
        const sprites = hasItemInHand ? {
            idle: 'Player-1-nohand.png', walk1: 'Player-1-1-nohand.png', walk2: 'Player-1-2-nohand.png'
        } : {
            idle: 'Player-1.png', walk1: 'Player-1-1.png', walk2: 'Player-1-2.png'
        };

        if (isMoving) player.src = currentFrame === 0 ? sprites.walk1 : sprites.walk2;
        else player.src = sprites.idle;
    }

    function initRandomHvorost() {
        groundHvorostList = [];
        for (let x = -3; x <= 3; x++) {
            for (let y = -3; y <= 3; y++) {
                if (Math.random() < 0.35) {
                    groundHvorostList.push({
                        id: Math.random().toString(),
                        locX: x, locY: y,
                        x: Math.random() * (window.innerWidth - 200) + 100,
                        y: Math.random() * (window.innerHeight - 200) + 100
                    });
                }
            }
        }
    }

    function updateGroundItemsDisplay() {
        groundItemsContainer.innerHTML = '';
        groundHvorostList.forEach(item => {
            if (item.locX === locX && item.locY === locY) {
                const img = document.createElement('img');
                img.src = 'hvorost.png';
                img.className = 'ground-item-elem';
                img.style.left = `${item.x}px`;
                img.style.top = `${item.y}px`;
                groundItemsContainer.appendChild(img);
            }
        });
    }

    function checkItemPickups() {
        if (isAxeOnGround && window.axeLocX === locX && window.axeLocY === locY) {
            const dist = Math.hypot(posX - axeX, posY - axeY);
            if (dist < 45) {
                if (addItemToInventory('axe', 'Topor.png')) {
                    isAxeOnGround = false;
                    axe.style.display = 'none';
                }
            }
        }

        for (let i = groundHvorostList.length - 1; i >= 0; i--) {
            const item = groundHvorostList[i];
            if (item.locX === locX && item.locY === locY) {
                const dist = Math.hypot(posX - item.x, posY - item.y);
                if (dist < 45) {
                    if (addItemToInventory('hvorost', 'hvorost.png')) {
                        groundHvorostList.splice(i, 1);
                        updateGroundItemsDisplay();
                    }
                }
            }
        }
    }

    function checkCampfireInteraction() {
        if (locX !== 0 || locY !== 0) return;
        const currentItem = getSelectedItem();
        if (!currentItem || currentItem.type !== 'hvorost') return;

        const distToCampfire = Math.hypot(posX - campfireX, posY - campfireY);
        if (distToCampfire < campfireRadius + 25) {
            inventory[activeSlotIndex] = null;
            renderInventoryUI();
            updateWeaponInHand();

            campfireHP = Math.min(100, campfireHP + 20);
            updateCampfireHpDisplay();
        }
    }

    function updateCampfireHpDisplay() {
        campfireHpText.textContent = `${Math.max(0, campfireHP)}XP`;
    }

    function initZombiesArray() {
        zombiesList = [];
        for (let x = -3; x <= 3; x++) {
            for (let y = -3; y <= 3; y++) {
                if (x === 0 && y === 0) continue;
                zombiesList.push({
                    locX: x, locY: y,
                    x: Math.random() * (window.innerWidth - 200) + 100,
                    y: Math.random() * (window.innerHeight - 200) + 100,
                    hp: 5, isAlive: false, frame: 0, lastStep: 0
                });
            }
        }
    }

    function spawnAllZombies() {
        if (!isNight) return;
        zombiesList.forEach(z => {
            z.isAlive = true; z.hp = 5;
            z.x = Math.random() * (window.innerWidth - 200) + 100;
            z.y = Math.random() * (window.innerHeight - 200) + 100;
        });
        updateZombieVisibility();
    }

    function getCurrentLocationZombie() {
        return zombiesList.find(z => z.locX === locX && z.locY === locY);
    }

    function updateZombieVisibility() {
        const currentZombie = getCurrentLocationZombie();
        if (currentZombie && currentZombie.isAlive && isNight) {
            zombieElem.style.display = 'block';
            zombieElem.style.left = `${currentZombie.x}px`;
            zombieElem.style.top = `${currentZombie.y}px`;
        } else {
            zombieElem.style.display = 'none';
        }
    }

    function triggerScreenFade(action) {
        fadeOverlay.style.pointerEvents = 'all';
        fadeOverlay.style.opacity = '1';
        setTimeout(() => {
            if (action) action();
            setTimeout(() => {
                fadeOverlay.style.opacity = '0';
                fadeOverlay.style.pointerEvents = 'none';

        }, 1000);
    }

        nightMusic.currentTime = 0;

        dayMusic.volume = musicVolume;
        dayMusic.play().catch(() => {});
        currentActiveMusic = dayMusic;

        campfireTimerCounter = 0;
        locX = 0; locY = 0;

        updateWeaponInHand();

        initZombiesArray();
        initRandomHvorost();

        axeY = Math.round(campfireY / gridSize) * gridSize;

        axeY = Math.max(60, Math.min(window.innerHeight - 60, axeY));

        timerInterval = setInterval(gameTimerLoop, 1000);

    function updateHealthDisplay() { healthUI.textContent = `HP: ${playerHP} / 10`; }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerDisplay() {
        if (!isNight) timerUI.textContent = `ДЕНЬ ${dayCount} | НОЧЬ ЧЕРЕЗ ${formatTime(timeRemaining)}`;
        else timerUI.textContent = `ДЕНЬ ${dayCount} | НОВЫЙ ДЕНЬ ЧЕРЕЗ ${formatTime(timeRemaining)}`;
    }

    function showDayText(text) {
        dayAnnouncement.textContent = text;
        dayAnnouncement.style.opacity = '1';
        setTimeout(() => dayAnnouncement.style.opacity = '0', 3000);
    }

    function triggerGameOver() {
        isGameRunning = false;
        if (timerInterval) clearInterval(timerInterval);
        playDeathSound();
        triggerScreenFade(() => {
            scene.style.display = 'none';
            pauseMenu.style.display = 'none';
            menuConfirmContent.style.display = 'none';
            mainMenuSettings.style.display = 'flex';
            menuMainContent.style.display = 'flex';
            mainMenu.style.display = 'flex';
        });
    }

    function gameTimerLoop() {
        if (isPaused || !isGameRunning) return;
        
        campfireTimerCounter++;
        if (campfireTimerCounter >= 3) {
            campfireTimerCounter = 0;
            campfireHP = Math.max(0, campfireHP - 1);
            updateCampfireHpDisplay();

            if (campfireHP <= 0) {
                triggerGameOver();
                return;
            }
        }

        timeRemaining--;

        if (isNight && timeRemaining % 3 === 0) {
            zombiesList.forEach(z => {
                if (!z.isAlive) {
                    z.isAlive = true; z.hp = 5;
                    z.x = Math.random() * (window.innerWidth - 200) + 100;
                    z.y = Math.random() * (window.innerHeight - 200) + 100;
                }
            });
            updateZombieVisibility();
        }

        if (timeRemaining <= 0) {
            if (!isNight) {
                isNight = true; 
                timeRemaining = 60; 
                nightOverlay.style.opacity = '1'; 
                spawnAllZombies();
                switchBackgroundMusic(true);
            } else {
                isNight = false; 
                dayCount++; 
                timeRemaining = 110; 
                nightOverlay.style.opacity = '0';
                showDayText(`ДЕНЬ ${dayCount}`);
                zombiesList.forEach(z => z.isAlive = false);
                updateZombieVisibility();
                switchBackgroundMusic(false);
            }
        }
        updateTimerDisplay();
    }

    function updateAnimationState(moving) {
        if (isMoving === moving) return;
        isMoving = moving;
        if (isMoving) {
            currentFrame = 0; updatePlayerSprite();
            animTimer = setInterval(() => {
                currentFrame = currentFrame === 0 ? 1 : 0; updatePlayerSprite();
            }, 500);
        } else {
            clearInterval(animTimer); animTimer = null; updatePlayerSprite();
        }
    }

    playBtn.addEventListener('click', () => triggerScreenFade(() => startNewGame()));

    pauseBtn.addEventListener('click', () => { isPaused = true; pauseMenu.style.display = 'flex'; });

    resumeBtn.addEventListener('click', () => { isPaused = false; pauseMenu.style.display = 'none'; });

    toMenuBtn.addEventListener('click', () => {
        triggerScreenFade(() => {
            isGameRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            scene.style.display = 'none';
            pauseMenu.style.display = 'none';
            menuConfirmContent.style.display = 'none';
            mainMenuSettings.style.display = 'flex';
            menuMainContent.style.display = 'flex';
            mainMenu.style.display = 'flex';
        });
    });

    window.addEventListener('keydown', (e) => { 
        if (e.code in keys) keys[e.code] = true; 
        if (e.code === 'Space') attackTarget();

        if ((e.code === 'KeyQ' || e.key === 'q' || e.key === 'Q' || e.key === 'й' || e.key === 'Й') && isGameRunning && !isPaused) dropSelectedItem();

        if (e.code.startsWith('Digit')) {
            const num = parseInt(e.code.replace('Digit', '')) - 1;
            if (num >= 0 && num <= 4) selectSlot(num);
        }

        if ((e.code === 'KeyX' || e.code === 'KeyH' || e.code === 'х' || e.code === 'Х') && isGameRunning && !isPaused) {
            timeRemaining = 0; gameTimerLoop();
        }
    });

    window.addEventListener('keyup', (e) => { if (e.code in keys) keys[e.code] = false; });

    function getJoystickDelta(baseElem, clientX, clientY) {
        const rect = baseElem.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;
        const maxRadius = rect.width / 2;
        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxRadius) {
            deltaX = (deltaX / distance) * maxRadius;
            deltaY = (deltaY / distance) * maxRadius;
        }
        return { deltaX, deltaY, distance, maxRadius };
    }

    moveBase.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || isPaused) return;
        isMoveDragging = true; handleMoveJoystick(e.clientX, e.clientY);
    });

    aimBase.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || !getSelectedItem() || isPaused) return;
        isAimDragging = true; isAimingActive = true; handleAimJoystick(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (e.buttons === 0) {
            if (isMoveDragging) resetMoveJoystick();
            if (isAimDragging) resetAimJoystick();
            return;
        }
        if (isMoveDragging) handleMoveJoystick(e.clientX, e.clientY);
        if (isAimDragging) handleAimJoystick(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', () => {
        if (isMoveDragging) resetMoveJoystick();
        if (isAimDragging) resetAimJoystick();
    });

    moveBase.addEventListener('touchstart', (e) => {
        if (moveTouchId !== null || isPaused) return;
        const touch = e.changedTouches[0];
        moveTouchId = touch.identifier;
        isMoveDragging = true; handleMoveJoystick(touch.clientX, touch.clientY);
    }, { passive: false });

    aimBase.addEventListener('touchstart', (e) => {
        if (aimTouchId !== null || !getSelectedItem() || isPaused) return;
        const touch = e.changedTouches[0];
        aimTouchId = touch.identifier;
        isAimDragging = true; isAimingActive = true; handleAimJoystick(touch.clientX, touch.clientY);
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
            if (isMoveDragging && touch.identifier === moveTouchId) handleMoveJoystick(touch.clientX, touch.clientY);
            if (isAimDragging && touch.identifier === aimTouchId) handleAimJoystick(touch.clientX, touch.clientY);
        }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === moveTouchId) resetMoveJoystick();
            if (touch.identifier === aimTouchId) resetAimJoystick();
        }
    });

    function handleMoveJoystick(clientX, clientY) {
        const { deltaX, deltaY, distance, maxRadius } = getJoystickDelta(moveBase, clientX, clientY);
        moveStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        if (distance > 6) {
            speedX = (deltaX / maxRadius) * maxSpeed;
            speedY = (deltaY / maxRadius) * maxSpeed;
        } else { speedX = 0; speedY = 0; }
    }

    function resetMoveJoystick() {
        isMoveDragging = false; moveTouchId = null;
        moveStick.style.transform = 'translate(-50%, -50%)'; speedX = 0; speedY = 0;
    }

    function handleAimJoystick(clientX, clientY) {
        const { deltaX, deltaY, distance } = getJoystickDelta(aimBase, clientX, clientY);
        aimStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        if (distance > 6 && activeSlotIndex !== null) {
            itemAngles[activeSlotIndex] = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            isAimingActive = true;
            attackTarget();
        }
    }

    function resetAimJoystick() {
        isAimDragging = false; aimTouchId = null;
        aimStick.style.transform = 'translate(-50%, -50%)'; isAimingActive = false;
    }

    function updateVisibilityForCurrentLocation() {
        const isStartLoc = (locX === 0 && locY === 0);
        kosterContainer.style.display = isStartLoc ? 'block' : 'none';
        
        if (isAxeOnGround && window.axeLocX === locX && window.axeLocY === locY) axe.style.display = 'block';
        else axe.style.display = 'none';

        updateGroundItemsDisplay();
        updateZombieVisibility();
    }

    function drawMinimap() {
        const cellSize = 11; 
        ctx.clearRect(0, 0, 80, 80);

        for (let x = 0; x < 7; x++) {
            for (let y = 0; y < 7; y++) {
                ctx.fillStyle = '#222222';
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
            }
        }

        const kosterGridX = 3 + locX;
        const kosterGridY = 3 - locY;

        if (kosterGridX >= 0 && kosterGridX < 7 && kosterGridY >= 0 && kosterGridY < 7) {
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(kosterGridX * cellSize + 1, kosterGridY * cellSize + 1, cellSize - 2, cellSize - 2);
        }

        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(3 * cellSize + 1, 3 * cellSize + 1, cellSize - 2, cellSize - 2);
        locationCoordsUI.textContent = `X: ${locX} Y: ${locY}`;
    }

    function checkLocationTransition(nextX, nextY) {
        let changed = false;

        if (nextY < paddingYTop) {
            if (locY < MAX_LOC) { locY += 1; nextY = window.innerHeight - paddingYBottom - 5; changed = true; }
            else { nextY = paddingYTop; }
        } else if (nextY > window.innerHeight - paddingYBottom) {
            if (locY > MIN_LOC) { locY -= 1; nextY = paddingYTop + 5; changed = true; }
            else { nextY = window.innerHeight - paddingYBottom; }
        }

        if (nextX < paddingX) {
            if (locX > MIN_LOC) { locX -= 1; nextX = window.innerWidth - paddingX - 5; changed = true; }
            else { nextX = paddingX; }
        } else if (nextX > window.innerWidth - paddingX) {
            if (locX < MAX_LOC) { locX += 1; nextX = paddingX + 5; changed = true; }
            else { nextX = window.innerWidth - paddingX; }
        }

        if (changed) { updateVisibilityForCurrentLocation(); drawMinimap(); }
        return { nextX, nextY };
    }

    function updateZombieLogic(now) {
        if (!isNight) return;
        const currentZombie = getCurrentLocationZombie();
        if (!currentZombie || !currentZombie.isAlive) return;

        const distToPlayer = Math.hypot(posX - currentZombie.x, posY - currentZombie.y);

        if (distToPlayer < 650) { 
            if (now - currentZombie.lastStep > 500) {
                currentZombie.lastStep = now;
                const angle = Math.atan2(posY - currentZombie.y, posX - currentZombie.x);
                const stepSize = 22; 
                currentZombie.x += Math.cos(angle) * stepSize;
                currentZombie.y += Math.sin(angle) * stepSize;

                currentZombie.frame = currentZombie.frame === 0 ? 1 : 0;
                zombieElem.src = currentZombie.frame === 0 ? 'zombie-1-1.png' : 'zombie-1-2.png';
            }
        } else { zombieElem.src = 'zombie-1.png'; }

        zombieElem.style.left = `${currentZombie.x}px`;
        zombieElem.style.top = `${currentZombie.y}px`;

        if (distToPlayer < 75 && canTakeDamage) {
            playerHP -= 1; updateHealthDisplay(); canTakeDamage = false;

            playPlayerHurtSound();
            player.classList.add('shake-effect', 'player-hit');
            setTimeout(() => player.classList.remove('shake-effect', 'player-hit'), 400);

            if (playerHP <= 0) {
                triggerGameOver();
            } else { setTimeout(() => { canTakeDamage = true; }, 2000); }
        }
    }

    function attackTarget() {
        const currentItem = getSelectedItem();
        if (!currentItem || currentItem.type !== 'axe' || !canAttack || isPaused) return;

        canAttack = false; setTimeout(() => { canAttack = true; }, 150); 

        const currentZombie = getCurrentLocationZombie();
        if (isNight && currentZombie && currentZombie.isAlive) {
            const dist = Math.hypot(posX - currentZombie.x, posY - currentZombie.y);
            
            if (dist < 110) {
                const damage = currentItem.type === 'axe' ? 1 : 0.5;
                currentZombie.hp -= damage;
                
                zombieElem.classList.add('shake-effect', 'zombie-hit');
                setTimeout(() => zombieElem.classList.remove('shake-effect', 'zombie-hit'), 400);

                if (currentZombie.hp <= 0) {
                    currentZombie.isAlive = false; zombieElem.style.display = 'none';
                    if (Math.random() < 0.50) {
                        groundHvorostList.push({ id: Math.random().toString(), locX: locX, locY: locY, x: currentZombie.x, y: currentZombie.y });
                        updateGroundItemsDisplay();
                    }
                }
            }
        }
    }

    function updateControls() {
        let moveX = 0, moveY = 0;

        if (isMoveDragging) {
            moveX = speedX; moveY = speedY;
        } else {
            if (keys.KeyW) moveY -= 1;
            if (keys.KeyS) moveY += 1;
            if (keys.KeyA) moveX -= 1;
            if (keys.KeyD) moveX += 1;

            if (moveX !== 0 && moveY !== 0) { moveX *= 0.7071; moveY *= 0.7071; }
            moveX *= maxSpeed; moveY *= maxSpeed;
        }

        if (!isAimDragging && getSelectedItem() && activeSlotIndex !== null) {
            let aimX = 0, aimY = 0;
            if (keys.ArrowUp) aimY -= 1;
            if (keys.ArrowDown) aimY += 1;
            if (keys.ArrowLeft) aimX -= 1;
            if (keys.ArrowRight) aimX += 1;

            if (aimX !== 0 || aimY !== 0) {
                itemAngles[activeSlotIndex] = Math.atan2(aimY, aimX) * (180 / Math.PI);
                isAimingActive = true;
                attackTarget();
            }
        }

        const currentlyMoving = Math.hypot(moveX, moveY) > 0.5;
        updateAnimationState(currentlyMoving);

        return { moveX, moveY };
    }

    function gameLoop(timestamp) {
        if (isGameRunning && !isPaused) {
            const { moveX, moveY } = updateControls();
            let nextX = posX + moveX, nextY = posY + moveY;

            // Коллизия с костром
            if (locX === 0 && locY === 0) {
                const distToCampfire = Math.hypot(nextX - campfireX, nextY - campfireY);
                if (distToCampfire < campfireRadius) {
                    const angle = Math.atan2(nextY - campfireY, nextX - campfireX);
                    nextX = campfireX + Math.cos(angle) * campfireRadius;
                    nextY = campfireY + Math.sin(angle) * campfireRadius;
                }
            }

            // Коллизия с зомби
            const currentZombie = getCurrentLocationZombie();
            if (isNight && currentZombie && currentZombie.isAlive) {
                const distToZombie = Math.hypot(nextX - currentZombie.x, nextY - currentZombie.y);
                const solidRadius = 55; 
                if (distToZombie < solidRadius) {
                    const angle = Math.atan2(nextY - currentZombie.y, nextX - currentZombie.x);
                    nextX = currentZombie.x + Math.cos(angle) * solidRadius;
                    nextY = currentZombie.y + Math.sin(angle) * solidRadius;
                }
            }

            const transition = checkLocationTransition(nextX, nextY);
            posX = transition.nextX; posY = transition.nextY;

            player.style.left = `${posX}px`; player.style.top = `${posY}px`;

            if (getSelectedItem() && activeSlotIndex !== null) {
                const currentAngle = isAimingActive ? itemAngles[activeSlotIndex] : 0;
                const rad = currentAngle * (Math.PI / 180);

                const baseOffsetX = 45, baseOffsetY = 15;
                const shiftDistance = 20;
                const dynamicShiftX = Math.cos(rad) * shiftDistance;
                const dynamicShiftY = Math.sin(rad) * shiftDistance;

                weapon.style.left = `${posX + baseOffsetX + (isAimingActive ? dynamicShiftX : 0)}px`;
                weapon.style.top = `${posY + baseOffsetY + (isAimingActive ? dynamicShiftY : 0)}px`;
                weapon.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg) scaleX(-1)`;
            }

            checkItemPickups(); checkCampfireInteraction(); updateZombieLogic(timestamp);
        }
        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
</script>
