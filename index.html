<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be a Volunteer [BETA]</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: monospace, sans-serif;
        }

        /* ЭКРАН ЗАТЕМНЕНИЯ / ПЕРЕХОДОВ */
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        /* АНИМАЦИЯ ПОКАЧИВАНИЯ ДЛЯ МЕНЮ */
        @keyframes slowRock {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        /* ГЛАВНОЕ МЕНЮ */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff url('main-menu.png') no-repeat center center;
            background-size: 100% 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
        }

        #menu-player {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 200px;
            height: 200px;
            object-fit: contain;
            pointer-events: none;
            animation: slowRock 5s infinite ease-in-out;
            transform-origin: center center;
        }

        #menu-koster {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 180px;
            height: 180px;
            object-fit: contain;
            pointer-events: none;
            animation: slowRock 4.5s infinite ease-in-out;
            transform-origin: center center;
            filter: drop-shadow(0px 0px 12px rgba(255, 140, 0, 0.8));
        }

        #menu-main-content, #menu-confirm-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #menu-main-content h1 {
            color: #000000;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        #menu-confirm-content h2 {
            color: #000000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.1s, background 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #333333;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* МЕНЮ ПАУЗЫ */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 80;
        }
        #pause-menu h2 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 8px;
        }

        /* ИГРОВАЯ СЦЕНА */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Grass.png');
            background-repeat: repeat;
            background-size: 128px 128px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: none;
        }
        
        /* Ночной фильтр */
        #night-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 22, 0.82);
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        /* СВЕТ ОТ КОСТРА */
        #koster-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 16;
        }

        #koster-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 170, 50, 0.35) 0%, rgba(255, 100, 0, 0.15) 45%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            animation: firePulse 1.5s infinite alternate ease-in-out;
        }

        @keyframes firePulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        #koster {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            filter: drop-shadow(0px 0px 15px rgba(255, 140, 0, 0.8));
        }

        #player {
            position: absolute;
            width: 256px;
            height: 256px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
        }
        #weapon {
            position: absolute;
            width: 320px;
            height: 240px;
            display: none;
            pointer-events: none;
            z-index: 3;
            transform-origin: center center;
            transform: translate(-50%, -50%) rotate(0deg) scaleX(-1);
            transition: left 0.05s ease-out, top 0.05s ease-out;
        }
        #axe {
            position: absolute;
            width: 180px;
            height: 180px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        /* ЭФФЕКТ ТРЯСКИ ДЛЯ ОБЪЕКТОВ */
        @keyframes shakeAnim {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            20% { transform: translate(-50%, -50%) translate(-6px, 4px); }
            40% { transform: translate(-50%, -50%) translate(6px, -4px); }
            60% { transform: translate(-50%, -50%) translate(-4px, -2px); }
            80% { transform: translate(-50%, -50%) translate(4px, 2px); }
            100% { transform: translate(-50%, -50%) translate(0, 0); }
        }
        .shake-effect {
            animation: shakeAnim 0.5s ease;
        }

        /* ХВОРОСТ НА ЗЕМЛЕ */
        .ground-item-elem {
            position: absolute;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .drop-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            box-shadow: 0 0 6px #ffffff;
            animation: particleAnimation 500ms linear forwards;
        }

        @keyframes particleAnimation {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
                opacity: 0;
            }
        }

        /* ВРАГ ЗОМБИ */
        #zombie {
            position: absolute;
            width: 256px;
            height: 256px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            display: none;
            transition: filter 0.2s ease;
        }
        .zombie-hit {
            filter: drop-shadow(0px 0px 0px red) sepia(100%) hue-rotate(-50deg) saturate(600%);
        }

        /* КОНТЕЙНЕР ХОТБАРА И КНОПКИ ВЫБРОСА */
        #hotbar-wrapper {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 40;
        }

        #hotbar {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 10px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Кнопка выброса предмета */
        #drop-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            padding: 0 12px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
        }
        #drop-btn:hover {
            background: rgba(50, 50, 50, 0.85);
            border-color: #ffffff;
        }
        #drop-btn:active {
            transform: scale(0.95);
        }

        .inventory-slot {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #888888;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .inventory-slot.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.25);
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        .inventory-slot img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            pointer-events: none;
        }

        /* UI джойстики */
        .joystick-base {
            position: absolute;
            bottom: 30px;
            width: 160px;
            height: 160px;
            background: rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            touch-action: none;
            cursor: pointer;
            z-index: 20;
        }
        #move-joystick-base {
            left: 30px;
        }
        #aim-joystick-base {
            right: 30px;
            display: none;
        }
        .joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        /* МИНИ-КАРТА */
        #minimap-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            z-index: 20;
            overflow: hidden;
        }
        #minimap-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #location-coords {
            position: absolute;
            bottom: 3px;
            left: 5px;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        /* ПЛАШКА ХП КОСТРА */
        #campfire-hp-bar {
            position: absolute;
            top: 125px;
            left: 15px;
            width: 100px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 3px 6px;
            gap: 6px;
            z-index: 20;
        }
        #campfire-hp-bar img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            pointer-events: none;
        }
        #campfire-hp-text {
            color: #ffaa44;
            font-size: 11px;
            font-weight: bold;
        }

        /* ТАЙМЕР ДНЯ И НОЧИ И ХУД */
        #day-night-timer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            z-index: 20;
            letter-spacing: 1px;
            text-align: center;
        }

        /* ЗДОРОВЬЕ ИГРОКА */
        #health-bar {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ff4444;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            z-index: 20;
            text-align: center;
        }

        /* КНОПКА ПАУЗЫ */
        #pause-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ОБЪЯВЛЕНИЕ ДНЯ */
        #day-announcement {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>

<!-- Затемнение экрана для переходов -->
<div id="fade-overlay"></div>

<!-- Главное меню -->
<div id="main-menu">
    <img id="menu-player" src="Player-1.png" alt="Player" draggable="false">
    <img id="menu-koster" src="Koster-1.png" alt="Koster" draggable="false">
    
    <!-- Основное содержимое меню -->
    <div id="menu-main-content">
        <h1>Be a Volunteer [BETA]</h1>
        <button id="play-btn" class="btn">ИГРАТЬ</button>
        <button id="exit-btn" class="btn">ВЫХОД</button>
    </div>

    <!-- Меню подтверждения выхода -->
    <div id="menu-confirm-content" style="display: none;">
        <h2>ТОЧНО ЛИ ВЫ ЭТО ХОТИТЕ?</h2>
        <div class="btn-group">
            <button id="confirm-yes-btn" class="btn">ДА</button>
            <button id="confirm-no-btn" class="btn">НЕТ</button>
        </div>
    </div>
</div>

<!-- Меню паузы -->
<div id="pause-menu">
    <h2>ПАУЗА</h2>
    <button id="resume-btn" class="btn">ПРОДОЛЖИТЬ</button>
    <button id="to-menu-btn" class="btn">В МЕНЮ</button>
</div>

<!-- Игровая сценa -->
<div id="scene">
    <!-- Ночной фильтр -->
    <div id="night-overlay"></div>

    <!-- Объект костра с эффектом свечения -->
    <div id="koster-container">
        <div id="koster-glow"></div>
        <img id="koster" src="Koster-1.png" alt="Koster" draggable="false">
    </div>
    
    <img id="axe" src="Topor.png" alt="Topor" draggable="false">
    
    <!-- Контейнер для хвороста на земле -->
    <div id="ground-items-container"></div>

    <!-- Персонаж, оружие и враг -->
    <img id="player" src="Player-1.png" alt="Player-1" draggable="false">
    <img id="weapon" src="Ryka-topor.png" alt="Ryka-topor" draggable="false">
    <img id="zombie" src="zombie-1.png" alt="zombie" draggable="false">
    
    <!-- Панель Инвентаря и Кнопка Выброса -->
    <div id="hotbar-wrapper">
        <div id="hotbar">
            <div class="inventory-slot" data-index="0"></div>
            <div class="inventory-slot" data-index="1"></div>
            <div class="inventory-slot" data-index="2"></div>
            <div class="inventory-slot" data-index="3"></div>
            <div class="inventory-slot" data-index="4"></div>
        </div>
        <button id="drop-btn">ВЫБРОСИТЬ</button>
    </div>

    <!-- Мини-карта и ХП костра -->
    <div id="minimap-container">
        <canvas id="minimap-canvas" width="100" height="100"></canvas>
        <div id="location-coords">X: 0 Y: 0</div>
    </div>
    <div id="campfire-hp-bar">
        <img src="Koster-1.png" alt="Campfire Icon" draggable="false">
        <div id="campfire-hp-text">100XP</div>
    </div>

    <!-- UI Элементы -->
    <div id="day-night-timer">ДЕНЬ 0 | НОЧЬ ЧЕРЕЗ 01:50</div>
    <div id="health-bar">HP: 10 / 10</div>
    <button id="pause-btn">❚❚</button>

    <!-- Объявление Нового Дня -->
    <div id="day-announcement">ДЕНЬ 0</div>

    <!-- Джойстик Ходьбы -->
    <div id="move-joystick-base" class="joystick-base">
        <div id="move-joystick-stick" class="joystick-stick"></div>
    </div>

    <!-- Джойстик Поворота Оружия -->
    <div id="aim-joystick-base" class="joystick-base">
        <div id="aim-joystick-stick" class="joystick-stick"></div>
    </div>
</div>

<script>
    // Элементы UI и сцены
    const fadeOverlay = document.getElementById('fade-overlay');
    const mainMenu = document.getElementById('main-menu');
    const menuMainContent = document.getElementById('menu-main-content');
    const menuConfirmContent = document.getElementById('menu-confirm-content');

    const pauseMenu = document.getElementById('pause-menu');
    const scene = document.getElementById('scene');

    const playBtn = document.getElementById('play-btn');
    const exitBtn = document.getElementById('exit-btn');
    const confirmYesBtn = document.getElementById('confirm-yes-btn');
    const confirmNoBtn = document.getElementById('confirm-no-btn');

    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const toMenuBtn = document.getElementById('to-menu-btn');
    const dropBtn = document.getElementById('drop-btn');

    const player = document.getElementById('player');
    const weapon = document.getElementById('weapon');
    const axe = document.getElementById('axe');
    const zombieElem = document.getElementById('zombie');
    const kosterContainer = document.getElementById('koster-container');
    const groundItemsContainer = document.getElementById('ground-items-container');

    const moveBase = document.getElementById('move-joystick-base');
    const moveStick = document.getElementById('move-joystick-stick');
    const aimBase = document.getElementById('aim-joystick-base');
    const aimStick = document.getElementById('aim-joystick-stick');

    const minimapCanvas = document.getElementById('minimap-canvas');
    const ctx = minimapCanvas.getContext('2d');
    const locationCoordsUI = document.getElementById('location-coords');
    const campfireHpText = document.getElementById('campfire-hp-text');
    
    const timerUI = document.getElementById('day-night-timer');
    const healthUI = document.getElementById('health-bar');
    const nightOverlay = document.getElementById('night-overlay');
    const dayAnnouncement = document.getElementById('day-announcement');
    const slots = document.querySelectorAll('.inventory-slot');

    document.addEventListener('dragstart', (e) => e.preventDefault());

    // Состояния игры
    let isPaused = false;
    let isGameRunning = false;
    let timerInterval = null;

    // Параметры игрока
    let playerHP = 10;
    let canTakeDamage = true;
    let canAttack = true;

    // Параметры костра
    let campfireHP = 100;
    let campfireTimerCounter = 0;

    // Костёр
    const campfireX = window.innerWidth / 2;
    const campfireY = window.innerHeight / 2;
    const campfireRadius = 100;

    // Координаты игрока
    let posX = 0;
    let posY = 0;
    let speedX = 0;
    let speedY = 0;
    const maxSpeed = 5;

    // Локация игрока 7x7
    let locX = 0;
    let locY = 0;
    const MIN_LOC = -3;
    const MAX_LOC = 3;

    // Границы экрана
    const paddingX = 80;
    const paddingYTop = 80;   
    const paddingYBottom = 80; 

    // ИНВЕНТАРЬ И УГЛЫ ПОВОРОТА ПРЕДМЕТОВ
    let inventory = [null, null, null, null, null]; 
    let itemAngles = [0, 0, 0, 0, 0]; 
    let activeSlotIndex = null; 
    let isAimingActive = false;

    // Управление
    let isMoveDragging = false;
    let moveTouchId = null;
    let isAimDragging = false;
    let aimTouchId = null;

    const keys = {
        KeyW: false, KeyA: false, KeyS: false, KeyD: false,
        ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
        Space: false
    };

    let isMoving = false;
    let animTimer = null;
    let currentFrame = 0;

    // Топор
    const gridSize = 80;
    let axeX = 0;
    let axeY = 0;
    let isAxeOnGround = true;

    // Хворост на земле
    let groundHvorostList = [];

    // Таймер дня/ночи
    let dayCount = 0;
    let isNight = false;
    let timeRemaining = 110;

    // СИСТЕМА ЗОМБИ
    let zombiesList = [];

    // --- ЛОГИКА КНОПКИ ВЫХОДА И ПОДТВЕРЖДЕНИЯ ---
    exitBtn.addEventListener('click', () => {
        menuMainContent.style.display = 'none';
        menuConfirmContent.style.display = 'flex';
    });

    confirmYesBtn.addEventListener('click', () => {
        window.close();
        window.location.href = "about:blank";
    });

    confirmNoBtn.addEventListener('click', () => {
        menuConfirmContent.style.display = 'none';
        menuMainContent.style.display = 'flex';
    });

    // --- ФУНКЦИЯ ВЫБРОСА ПРЕДМЕТА ---
    function dropSelectedItem() {
        if (!isGameRunning || isPaused || activeSlotIndex === null) return;
        const currentItem = inventory[activeSlotIndex];
        if (!currentItem) return;

        inventory[activeSlotIndex] = null;
        renderInventoryUI();
        updateWeaponInHand();

        const offsets = [
            {dx: -120, dy: 0}, {dx: 120, dy: 0}, {dx: 0, dy: -120}, {dx: 0, dy: 120},
            {dx: -120, dy: -120}, {dx: -120, dy: 120}, {dx: 120, dy: -120}, {dx: 120, dy: 120}
        ];
        const randomOffset = offsets[Math.floor(Math.random() * offsets.length)];
        
        let dropScreenX = posX + randomOffset.dx;
        let dropScreenY = posY + randomOffset.dy;

        dropScreenX = Math.max(90, Math.min(window.innerWidth - 90, dropScreenX));
        dropScreenY = Math.max(110, Math.min(window.innerHeight - 110, dropScreenY));

        if (currentItem.type === 'axe') {
            isAxeOnGround = true;
            axeX = dropScreenX;
            axeY = dropScreenY;
            window.axeLocX = locX;
            window.axeLocY = locY;
            axe.style.left = `${axeX}px`;
            axe.style.top = `${axeY}px`;
        } else if (currentItem.type === 'hvorost') {
            groundHvorostList.push({
                id: Math.random().toString(),
                locX: locX,
                locY: locY,
                x: dropScreenX,
                y: dropScreenY
            });
        }

        createWhiteFountainParticles(posX, posY);
        updateVisibilityForCurrentLocation();
    }

    function createWhiteFountainParticles(x, y) {
        const particleCount = 20;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'drop-particle';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 90 + 30;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance - 20;

            particle.style.setProperty('--dx', `${dx}px`);
            particle.style.setProperty('--dy', `${dy}px`);

            scene.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 500);
        }
    }

    dropBtn.addEventListener('click', () => {
        dropSelectedItem();
    });

    // --- ЛОГИКА ИНВЕНТАРЯ ---
    function selectSlot(index) {
        if (activeSlotIndex === index) {
            activeSlotIndex = null;
            slots.forEach(slot => slot.classList.remove('active'));
            updateWeaponInHand();
            return;
        }

        activeSlotIndex = index;
        slots.forEach((slot, i) => {
            if (i === index) {
                slot.classList.add('active');
            } else {
                slot.classList.remove('active');
            }
        });
        updateWeaponInHand();
    }

    slots.forEach((slot, index) => {
        slot.addEventListener('click', () => selectSlot(index));
    });

    window.addEventListener('wheel', (e) => {
        if (!isGameRunning || isPaused) return;
        
        if (activeSlotIndex === null) {
            activeSlotIndex = e.deltaY > 0 ? 0 : 4;
        } else {
            if (e.deltaY > 0) {
                activeSlotIndex = (activeSlotIndex + 1) % 5;
            } else {
                activeSlotIndex = (activeSlotIndex - 1 + 5) % 5;
            }
        }
        selectSlot(activeSlotIndex);
    });

    function addItemToInventory(itemType, iconSrc) {
        const emptyIndex = inventory.findIndex(item => item === null);
        if (emptyIndex === -1) return false;

        inventory[emptyIndex] = { type: itemType, icon: iconSrc };
        itemAngles[emptyIndex] = 0; 
        renderInventoryUI();
        
        if (emptyIndex === activeSlotIndex) {
            updateWeaponInHand();
        }
        
        return true;
    }

    function renderInventoryUI() {
        slots.forEach((slot, i) => {
            slot.innerHTML = '';
            if (inventory[i]) {
                const img = document.createElement('img');
                img.src = inventory[i].icon;
                slot.appendChild(img);
            }
        });
    }

    function getSelectedItem() {
        if (activeSlotIndex === null) return null;
        return inventory[activeSlotIndex];
    }

    function updateWeaponInHand() {
        const currentItem = getSelectedItem();
        if (currentItem) {
            weapon.style.display = 'block';
            aimBase.style.display = 'block';

            if (currentItem.type === 'axe') {
                weapon.src = 'Ryka-topor.png';
            } else if (currentItem.type === 'hvorost') {
                weapon.src = 'Ryka-hvorost.png';
            }
        } else {
            weapon.style.display = 'none';
            aimBase.style.display = 'none';
        }
        updatePlayerSprite();
    }

    function updatePlayerSprite() {
        const hasItemInHand = getSelectedItem() !== null;
        const sprites = hasItemInHand ? {
            idle: 'Player-1-nohand.png',
            walk1: 'Player-1-1-nohand.png',
            walk2: 'Player-1-2-nohand.png'
        } : {
            idle: 'Player-1.png',
            walk1: 'Player-1-1.png',
            walk2: 'Player-1-2.png'
        };

        if (isMoving) {
            player.src = currentFrame === 0 ? sprites.walk1 : sprites.walk2;
        } else {
            player.src = sprites.idle;
        }
    }

    function initRandomHvorost() {
        groundHvorostList = [];

        for (let x = -3; x <= 3; x++) {
            for (let y = -3; y <= 3; y++) {
                if (Math.random() < 0.35) {
                    groundHvorostList.push({
                        id: Math.random().toString(),
                        locX: x,
                        locY: y,
                        x: Math.random() * (window.innerWidth - 300) + 150,
                        y: Math.random() * (window.innerHeight - 300) + 150
                    });
                }
            }
        }
    }

    function updateGroundItemsDisplay() {
        groundItemsContainer.innerHTML = '';
        
        groundHvorostList.forEach(item => {
            if (item.locX === locX && item.locY === locY) {
                const img = document.createElement('img');
                img.src = 'hvorost.png';
                img.className = 'ground-item-elem';
                img.style.left = `${item.x}px`;
                img.style.top = `${item.y}px`;
                groundItemsContainer.appendChild(img);
            }
        });
    }

    function checkItemPickups() {
        if (isAxeOnGround && window.axeLocX === locX && window.axeLocY === locY) {
            const dist = Math.hypot(posX - axeX, posY - axeY);
            if (dist < 60) {
                if (addItemToInventory('axe', 'Topor.png')) {
                    isAxeOnGround = false;
                    axe.style.display = 'none';
                }
            }
        }

        for (let i = groundHvorostList.length - 1; i >= 0; i--) {
            const item = groundHvorostList[i];
            if (item.locX === locX && item.locY === locY) {
                const dist = Math.hypot(posX - item.x, posY - item.y);
                if (dist < 65) {
                    if (addItemToInventory('hvorost', 'hvorost.png')) {
                        groundHvorostList.splice(i, 1);
                        updateGroundItemsDisplay();
                    }
                }
            }
        }
    }

    function checkCampfireInteraction() {
        if (locX !== 0 || locY !== 0) return;
        const currentItem = getSelectedItem();
        if (!currentItem || currentItem.type !== 'hvorost') return;

        const distToCampfire = Math.hypot(posX - campfireX, posY - campfireY);
        if (distToCampfire < campfireRadius + 30) {
            inventory[activeSlotIndex] = null;
            renderInventoryUI();
            updateWeaponInHand();

            campfireHP = Math.min(100, campfireHP + 20);
            updateCampfireHpDisplay();
        }
    }

    function updateCampfireHpDisplay() {
        campfireHpText.textContent = `${Math.max(0, campfireHP)}XP`;
    }

    function initZombiesArray() {
        zombiesList = [];
        for (let x = -3; x <= 3; x++) {
            for (let y = -3; y <= 3; y++) {
                if (x === 0 && y === 0) continue;
                zombiesList.push({
                    locX: x,
                    locY: y,
                    x: Math.random() * (window.innerWidth - 300) + 150,
                    y: Math.random() * (window.innerHeight - 300) + 150,
                    hp: 5,
                    isAlive: false,
                    frame: 0,
                    lastStep: 0
                });
            }
        }
    }

    function spawnAllZombies() {
        if (!isNight) return;
        zombiesList.forEach(z => {
            z.isAlive = true;
            z.hp = 5;
            z.x = Math.random() * (window.innerWidth - 300) + 150;
            z.y = Math.random() * (window.innerHeight - 300) + 150;
        });
        updateZombieVisibility();
    }

    function getCurrentLocationZombie() {
        return zombiesList.find(z => z.locX === locX && z.locY === locY);
    }

    function updateZombieVisibility() {
        const currentZombie = getCurrentLocationZombie();
        if (currentZombie && currentZombie.isAlive && isNight) {
            zombieElem.style.display = 'block';
            zombieElem.style.left = `${currentZombie.x}px`;
            zombieElem.style.top = `${currentZombie.y}px`;
        } else {
            zombieElem.style.display = 'none';
        }
    }

    function triggerScreenFade(action) {
        fadeOverlay.style.pointerEvents = 'all';
        fadeOverlay.style.opacity = '1';
        setTimeout(() => {
            if (action) action();
            setTimeout(() => {
                fadeOverlay.style.opacity = '0';
                fadeOverlay.style.pointerEvents = 'none';
            }, 500);
        }, 1000);
    }

    function startNewGame() {
        playerHP = 10;
        campfireHP = 100;
        campfireTimerCounter = 0;
        locX = 0;
        locY = 0;
        posX = campfireX - campfireRadius - 40;
        posY = campfireY;
        
        inventory = [null, null, null, null, null];
        itemAngles = [0, 0, 0, 0, 0];
        isAimingActive = false;
        activeSlotIndex = null;
        slots.forEach(slot => slot.classList.remove('active'));
        renderInventoryUI();
        updateWeaponInHand();

        isAxeOnGround = true;
        window.axeLocX = 0; 
        window.axeLocY = 0;

        dayCount = 0;
        isNight = false;
        timeRemaining = 110;
        isPaused = false;
        
        initZombiesArray();
        initRandomHvorost();

        axeX = Math.round((campfireX + 300) / gridSize) * gridSize;
        axeY = Math.round(campfireY / gridSize) * gridSize;
        axeX = Math.max(90, Math.min(window.innerWidth - 90, axeX));
        axeY = Math.max(90, Math.min(window.innerHeight - 90, axeY));
        axe.style.left = `${axeX}px`;
        axe.style.top = `${axeY}px`;

        nightOverlay.style.opacity = '0';

        updateHealthDisplay();
        updateCampfireHpDisplay();
        updateTimerDisplay();
        updateVisibilityForCurrentLocation();
        drawMinimap();

        menuConfirmContent.style.display = 'none';
        menuMainContent.style.display = 'flex';
        mainMenu.style.display = 'none';
        pauseMenu.style.display = 'none';
        scene.style.display = 'block';
        isGameRunning = true;

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(gameTimerLoop, 1000);
    }

    function updateHealthDisplay() {
        healthUI.textContent = `HP: ${playerHP} / 10`;
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerDisplay() {
        if (!isNight) {
            timerUI.textContent = `ДЕНЬ ${dayCount} | НОЧЬ ЧЕРЕЗ ${formatTime(timeRemaining)}`;
        } else {
            timerUI.textContent = `ДЕНЬ ${dayCount} | НОВЫЙ ДЕНЬ ЧЕРЕЗ ${formatTime(timeRemaining)}`;
        }
    }

    function showDayText(text) {
        dayAnnouncement.textContent = text;
        dayAnnouncement.style.opacity = '1';
        setTimeout(() => {
            dayAnnouncement.style.opacity = '0';
        }, 3000);
    }

    function gameTimerLoop() {
        if (isPaused || !isGameRunning) return;
        
        campfireTimerCounter++;
        if (campfireTimerCounter >= 3) {
            campfireTimerCounter = 0;
            campfireHP = Math.max(0, campfireHP - 1);
            updateCampfireHpDisplay();

            if (campfireHP <= 0) {
                isGameRunning = false;
                if (timerInterval) clearInterval(timerInterval);
                triggerScreenFade(() => {
                    scene.style.display = 'none';
                    pauseMenu.style.display = 'none';
                    menuConfirmContent.style.display = 'none';
                    menuMainContent.style.display = 'flex';
                    mainMenu.style.display = 'flex';
                });
                return;
            }
        }

        timeRemaining--;

        if (isNight && timeRemaining % 3 === 0) {
            zombiesList.forEach(z => {
                if (!z.isAlive) {
                    z.isAlive = true;
                    z.hp = 5;
                    z.x = Math.random() * (window.innerWidth - 300) + 150;
                    z.y = Math.random() * (window.innerHeight - 300) + 150;
                }
            });
            updateZombieVisibility();
        }

        if (timeRemaining <= 0) {
            if (!isNight) {
                isNight = true;
                timeRemaining = 60;
                nightOverlay.style.opacity = '1';
                spawnAllZombies();
            } else {
                isNight = false;
                dayCount++;
                timeRemaining = 110;
                nightOverlay.style.opacity = '0';
                showDayText(`ДЕНЬ ${dayCount}`);
                
                zombiesList.forEach(z => z.isAlive = false);
                updateZombieVisibility();
            }
        }
        updateTimerDisplay();
    }

    function updateAnimationState(moving) {
        if (isMoving === moving) return;
        isMoving = moving;

        if (isMoving) {
            currentFrame = 0;
            updatePlayerSprite();
            animTimer = setInterval(() => {
                currentFrame = currentFrame === 0 ? 1 : 0;
                updatePlayerSprite();
            }, 500);
        } else {
            clearInterval(animTimer);
            animTimer = null;
            updatePlayerSprite();
        }
    }

    playBtn.addEventListener('click', () => {
        triggerScreenFade(() => startNewGame());
    });

    pauseBtn.addEventListener('click', () => {
        isPaused = true;
        pauseMenu.style.display = 'flex';
    });

    resumeBtn.addEventListener('click', () => {
        isPaused = false;
        pauseMenu.style.display = 'none';
    });

    toMenuBtn.addEventListener('click', () => {
        triggerScreenFade(() => {
            isGameRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            scene.style.display = 'none';
            pauseMenu.style.display = 'none';
            menuConfirmContent.style.display = 'none';
            menuMainContent.style.display = 'flex';
            mainMenu.style.display = 'flex';
        });
    });

    window.addEventListener('keydown', (e) => { 
        if (e.code in keys) keys[e.code] = true; 
        if (e.code === 'Space') attackTarget();

        if ((e.code === 'KeyQ' || e.key === 'q' || e.key === 'Q' || e.key === 'й' || e.key === 'Й') && isGameRunning && !isPaused) {
            dropSelectedItem();
        }

        if (e.code.startsWith('Digit')) {
            const num = parseInt(e.code.replace('Digit', '')) - 1;
            if (num >= 0 && num <= 4) selectSlot(num);
        }

        if ((e.code === 'KeyX' || e.code === 'KeyH' || e.code === 'х' || e.code === 'Х') && isGameRunning && !isPaused) {
            timeRemaining = 0;
            gameTimerLoop();
        }
    });

    window.addEventListener('keyup', (e) => { if (e.code in keys) keys[e.code] = false; });

    function getJoystickDelta(baseElem, clientX, clientY) {
        const rect = baseElem.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;
        const maxRadius = rect.width / 2;
        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxRadius) {
            deltaX = (deltaX / distance) * maxRadius;
            deltaY = (deltaY / distance) * maxRadius;
        }
        return { deltaX, deltaY, distance, maxRadius };
    }

    moveBase.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || isPaused) return;
        isMoveDragging = true;
        handleMoveJoystick(e.clientX, e.clientY);
    });

    aimBase.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || !getSelectedItem() || isPaused) return;
        isAimDragging = true;
        isAimingActive = true;
        handleAimJoystick(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (e.buttons === 0) {
            if (isMoveDragging) resetMoveJoystick();
            if (isAimDragging) resetAimJoystick();
            return;
        }
        if (isMoveDragging) handleMoveJoystick(e.clientX, e.clientY);
        if (isAimDragging) handleAimJoystick(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', () => {
        if (isMoveDragging) resetMoveJoystick();
        if (isAimDragging) resetAimJoystick();
    });

    moveBase.addEventListener('touchstart', (e) => {
        if (moveTouchId !== null || isPaused) return;
        const touch = e.changedTouches[0];
        moveTouchId = touch.identifier;
        isMoveDragging = true;
        handleMoveJoystick(touch.clientX, touch.clientY);
    }, { passive: false });

    aimBase.addEventListener('touchstart', (e) => {
        if (aimTouchId !== null || !getSelectedItem() || isPaused) return;
        const touch = e.changedTouches[0];
        aimTouchId = touch.identifier;
        isAimDragging = true;
        isAimingActive = true;
        handleAimJoystick(touch.clientX, touch.clientY);
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
            if (isMoveDragging && touch.identifier === moveTouchId) handleMoveJoystick(touch.clientX, touch.clientY);
            if (isAimDragging && touch.identifier === aimTouchId) handleAimJoystick(touch.clientX, touch.clientY);
        }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === moveTouchId) resetMoveJoystick();
            if (touch.identifier === aimTouchId) resetAimJoystick();
        }
    });

    function handleMoveJoystick(clientX, clientY) {
        const { deltaX, deltaY, distance, maxRadius } = getJoystickDelta(moveBase, clientX, clientY);
        moveStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        if (distance > 8) {
            speedX = (deltaX / maxRadius) * maxSpeed;
            speedY = (deltaY / maxRadius) * maxSpeed;
        } else {
            speedX = 0; speedY = 0;
        }
    }

    function resetMoveJoystick() {
        isMoveDragging = false;
        moveTouchId = null;
        moveStick.style.transform = 'translate(-50%, -50%)';
        speedX = 0; speedY = 0;
    }

    function handleAimJoystick(clientX, clientY) {
        const { deltaX, deltaY, distance } = getJoystickDelta(aimBase, clientX, clientY);
        aimStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        if (distance > 8 && activeSlotIndex !== null) {
            itemAngles[activeSlotIndex] = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            attackTarget();
        }
    }

    function resetAimJoystick() {
        isAimDragging = false;
        aimTouchId = null;
        aimStick.style.transform = 'translate(-50%, -50%)';
        isAimingActive = false;
    }

    function updateVisibilityForCurrentLocation() {
        const isStartLoc = (locX === 0 && locY === 0);
        kosterContainer.style.display = isStartLoc ? 'block' : 'none';
        
        if (isAxeOnGround && window.axeLocX === locX && window.axeLocY === locY) {
            axe.style.display = 'block';
        } else {
            axe.style.display = 'none';
        }

        updateGroundItemsDisplay();
        updateZombieVisibility();
    }

    function drawMinimap() {
        const cellSize = 14; 
        ctx.clearRect(0, 0, 100, 100);

        for (let x = 0; x < 7; x++) {
            for (let y = 0; y < 7; y++) {
                ctx.fillStyle = '#222222';
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
            }
        }

        const kosterGridX = 3 + locX;
        const kosterGridY = 3 - locY;

        if (kosterGridX >= 0 && kosterGridX < 7 && kosterGridY >= 0 && kosterGridY < 7) {
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(kosterGridX * cellSize + 1, kosterGridY * cellSize + 1, cellSize - 2, cellSize - 2);
        }

        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(3 * cellSize + 2, 3 * cellSize + 2, cellSize - 4, cellSize - 4);

        locationCoordsUI.textContent = `X: ${locX} Y: ${locY}`;
    }

    function checkLocationTransition(nextX, nextY) {
        let changed = false;

        if (nextY < paddingYTop) {
            if (locY < MAX_LOC) {
                locY += 1;
                nextY = window.innerHeight - paddingYBottom - 5;
                changed = true;
            } else {
                nextY = paddingYTop;
            }
        } else if (nextY > window.innerHeight - paddingYBottom) {
            if (locY > MIN_LOC) {
                locY -= 1;
                nextY = paddingYTop + 5;
                changed = true;
            } else {
                nextY = window.innerHeight - paddingYBottom;
            }
        }

        if (nextX < paddingX) {
            if (locX > MIN_LOC) {
                locX -= 1;
                nextX = window.innerWidth - paddingX - 5;
                changed = true;
            } else {
                nextX = paddingX;
            }
        } else if (nextX > window.innerWidth - paddingX) {
            if (locX < MAX_LOC) {
                locX += 1;
                nextX = paddingX + 5;
                changed = true;
            } else {
                nextX = window.innerWidth - paddingX;
            }
        }

        if (changed) {
            updateVisibilityForCurrentLocation();
            drawMinimap();
        }

        return { nextX, nextY };
    }

    function updateZombieLogic(now) {
        if (!isNight) return;

        const currentZombie = getCurrentLocationZombie();
        if (!currentZombie || !currentZombie.isAlive) return;

        const distToPlayer = Math.hypot(posX - currentZombie.x, posY - currentZombie.y);

        if (distToPlayer < 800) { 
            if (now - currentZombie.lastStep > 500) {
                currentZombie.lastStep = now;
                const angle = Math.atan2(posY - currentZombie.y, posX - currentZombie.x);
                const stepSize = 25; 
                currentZombie.x += Math.cos(angle) * stepSize;
                currentZombie.y += Math.sin(angle) * stepSize;

                currentZombie.frame = currentZombie.frame === 0 ? 1 : 0;
                zombieElem.src = currentZombie.frame === 0 ? 'zombie-1-1.png' : 'zombie-1-2.png';
            }
        } else {
            zombieElem.src = 'zombie-1.png';
        }

        zombieElem.style.left = `${currentZombie.x}px`;
        zombieElem.style.top = `${currentZombie.y}px`;

        if (distToPlayer < 35 && canTakeDamage) {
            playerHP -= 1;
            updateHealthDisplay();
            canTakeDamage = false;

            if (playerHP <= 0) {
                triggerScreenFade(() => {
                    isGameRunning = false;
                    if (timerInterval) clearInterval(timerInterval);
                    scene.style.display = 'none';
                    menuConfirmContent.style.display = 'none';
                    menuMainContent.style.display = 'flex';
                    mainMenu.style.display = 'flex';
                });
            } else {
                setTimeout(() => { canTakeDamage = true; }, 2000);
            }
        }
    }

    function attackTarget() {
        const currentItem = getSelectedItem();
        if (!currentItem || currentItem.type !== 'axe' || !canAttack || isPaused) return;

        canAttack = false;
        setTimeout(() => { canAttack = true; }, 1000); 

        const currentZombie = getCurrentLocationZombie();
        if (isNight && currentZombie && currentZombie.isAlive) {
            const dist = Math.hypot(posX - currentZombie.x, posY - currentZombie.y);
            if (dist < 80) {
                const damage = currentItem.type === 'axe' ? 1 : 0.5;
                currentZombie.hp -= damage;
                
                zombieElem.classList.add('shake-effect', 'zombie-hit');
                setTimeout(() => {
                    zombieElem.classList.remove('shake-effect', 'zombie-hit');
                }, 500);

                if (currentZombie.hp <= 0) {
                    currentZombie.isAlive = false;
                    zombieElem.style.display = 'none';

                    if (Math.random() < 0.50) {
                        groundHvorostList.push({
                            id: Math.random().toString(),
                            locX: locX,
                            locY: locY,
                            x: currentZombie.x,
                            y: currentZombie.y
                        });
                        updateGroundItemsDisplay();
                    }
                }
            }
        }
    }

    function updateControls() {
        let moveX = 0;
        let moveY = 0;

        if (isMoveDragging) {
            moveX = speedX;
            moveY = speedY;
        } else {
            if (keys.KeyW) moveY -= 1;
            if (keys.KeyS) moveY += 1;
            if (keys.KeyA) moveX -= 1;
            if (keys.KeyD) moveX += 1;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            moveX *= maxSpeed;
            moveY *= maxSpeed;
        }

        if (!isAimDragging && getSelectedItem() && activeSlotIndex !== null) {
            let aimX = 0;
            let aimY = 0;

            if (keys.ArrowUp) aimY -= 1;
            if (keys.ArrowDown) aimY += 1;
            if (keys.ArrowLeft) aimX -= 1;
            if (keys.ArrowRight) aimX += 1;

            if (aimX !== 0 || aimY !== 0) {
                itemAngles[activeSlotIndex] = Math.atan2(aimY, aimX) * (180 / Math.PI);
                isAimingActive = true;
            }
        }

        const currentlyMoving = Math.hypot(moveX, moveY) > 0.5;
        updateAnimationState(currentlyMoving);

        return { moveX, moveY };
    }

    function gameLoop(timestamp) {
        if (isGameRunning && !isPaused) {
            const { moveX, moveY } = updateControls();

            let nextX = posX + moveX;
            let nextY = posY + moveY;

            if (locX === 0 && locY === 0) {
                const distToCampfire = Math.hypot(nextX - campfireX, nextY - campfireY);
                if (distToCampfire < campfireRadius) {
                    const angle = Math.atan2(nextY - campfireY, nextX - campfireX);
                    nextX = campfireX + Math.cos(angle) * campfireRadius;
                    nextY = campfireY + Math.sin(angle) * campfireRadius;
                }
            }

            const transition = checkLocationTransition(nextX, nextY);
            posX = transition.nextX;
            posY = transition.nextY;

            player.style.left = `${posX}px`;
            player.style.top = `${posY}px`;

            if (getSelectedItem() && activeSlotIndex !== null) {
                const currentAngle = isAimingActive ? itemAngles[activeSlotIndex] : 0;
                const rad = currentAngle * (Math.PI / 180);

                const baseOffsetX = 80;
                const baseOffsetY = 25;

                const shiftDistance = 35;
                const dynamicShiftX = Math.cos(rad) * shiftDistance;
                const dynamicShiftY = Math.sin(rad) * shiftDistance;

                weapon.style.left = `${posX + baseOffsetX + (isAimingActive ? dynamicShiftX : 0)}px`;
                weapon.style.top = `${posY + baseOffsetY + (isAimingActive ? dynamicShiftY : 0)}px`;
                weapon.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg) scaleX(-1)`;
            }

            checkItemPickups();
            checkCampfireInteraction();
            updateZombieLogic(timestamp);
        }

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
